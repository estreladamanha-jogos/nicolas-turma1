<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fagulha — Minas de Gelo e Cristal</title>
<!-- fonte de videogame -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #020814; overflow: hidden; color: #fff;
    font-family: 'Press Start 2P', monospace; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  header h1 { margin: 0; font-size: 11px; color: #bfeaff; letter-spacing: 2px; }
  main { display: flex; justify-content: center; }
  canvas { display: block; height: auto; background: #0a1a2e; border-radius: 12px;
    box-shadow: 0 0 30px rgba(120,210,255,.4);
    width: min(96vw, calc((100vh - 50px) * 420 / 640));
    width: min(96vw, calc((100dvh - 50px) * 420 / 640)); }
  /* botões de toque (só aparecem no celular) */
  footer { display: none; gap: 12px; }
  footer button { width: 84px; height: 62px; font-size: 26px; border: none; border-radius: 14px;
    background: #1d4a6e; color: #fff; box-shadow: 0 4px 0 #0c2236; touch-action: none; }
  footer button:active { transform: translateY(3px); box-shadow: 0 1px 0 #0c2236; }
  #btnFogo { background: #ff7a2a; box-shadow: 0 4px 0 #9a3c08; }
  @media (hover: none) and (pointer: coarse) {
    footer { display: flex; }
    canvas { width: min(96vw, calc((100vh - 130px) * 420 / 640));
      width: min(96vw, calc((100dvh - 130px) * 420 / 640)); }
  }
</style>
</head>
<body>
<header><h1>FAGULHA: MINAS DE GELO E CRISTAL</h1></header>
<main>
  <canvas id="game" width="420" height="640"></canvas>
</main>
<footer>
  <button id="btnEsq">◀</button>
  <button id="btnFogo">🔥</button>
  <button id="btnDir">▶</button>
</footer>
<script>
/* Fagulha: um ET fofo e esquisito (cabeça grande, olhos enormes, orelhas de folha, braços e pernas compridos).
   o = { vx: -1..1 (inclinação), glow: cor da luz do peito (null = apagada), hit: true, alpha, pose: 'fall' | 'stand' | 'cheer' } */
function drawFagulha(c, x, y, s, t, o) {
  o = o || {};
  const glow = o.glow === undefined ? '#ffe9a8' : o.glow;
  const pose = o.pose || 'fall';
  const hit = !!o.hit;
  const sw = Math.sin(t * 7), sw2 = Math.sin(t * 7 + 1.9);
  const blink = (t % 3.4) > 3.27 ? 0.12 : 1;
  const ear = Math.sin(t * 3.2) * 5;
  const skinL = hit ? '#f0c4c4' : '#d3cdf0', skinD = hit ? '#d99a9a' : '#9a91c4', line = '#2b2350';
  c.save(); c.translate(x, y); c.scale(s, s);
  if (o.alpha !== undefined) c.globalAlpha = o.alpha;
  c.rotate((o.vx || 0) * 0.16);
  c.lineJoin = 'round'; c.lineCap = 'round';

  const P = { fall: [32, 78, 78, 12], stand: [-62, -78, -82, -6], cheer: [62, 88, 78, 8] }[pose];
  // ---- pernas (atrás do corpo) ----
  for (const sd of [-1, 1]) {
    const ph = sd === -1 ? sw : sw2;
    const hx = sd * 8, hy = 38;
    const kx = hx + sd * (5 + P[3] * .3) + ph * 3, ky = hy + 32;
    const fx = kx + sd * 3 + ph * (pose === 'fall' ? 9 : 2), fy = ky + 34;
    c.strokeStyle = line; c.lineWidth = 11; c.beginPath(); c.moveTo(hx, hy); c.lineTo(kx, ky); c.lineTo(fx, fy); c.stroke();
    c.strokeStyle = skinD; c.lineWidth = 7; c.beginPath(); c.moveTo(hx, hy); c.lineTo(kx, ky); c.lineTo(fx, fy); c.stroke();
    c.fillStyle = skinD; c.strokeStyle = line; c.lineWidth = 2;
    c.beginPath(); c.ellipse(fx + sd * 4, fy + 3, 12, 5.5, sd * -.12, 0, 7); c.fill(); c.stroke();
  }
  // ---- corpo ----
  const gb = c.createLinearGradient(0, -6, 0, 46); gb.addColorStop(0, skinL); gb.addColorStop(1, skinD);
  c.fillStyle = gb; c.strokeStyle = line; c.lineWidth = 2.4;
  c.beginPath(); c.moveTo(-9, -8); c.bezierCurveTo(-20, 4, -20, 34, -9, 44); c.lineTo(9, 44); c.bezierCurveTo(20, 34, 20, 4, 9, -8); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.18)'; c.beginPath(); c.ellipse(0, 26, 9, 13, 0, 0, 7); c.fill();
  // luz do peito (a "fagulha")
  if (glow) {
    const r = 9 + Math.sin(t * 5) * 1.6, g = c.createRadialGradient(0, 8, 0, 0, 8, r * 2.2);
    g.addColorStop(0, '#fff'); g.addColorStop(.25, glow); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 8, r * 2.2, 0, 7); c.fill();
  }
  // ---- braços ----
  for (const sd of [-1, 1]) {
    const ph = sd === -1 ? sw : sw2;
    const a1 = (P[0] + ph * (pose === 'fall' ? 16 : 5)) * Math.PI / 180, a2 = (P[1] + ph * (pose === 'fall' ? 18 : 6)) * Math.PI / 180;
    const sx = sd * 14, sy = 4;
    const ex = sx + sd * 30 * Math.cos(a1), ey = sy - 30 * Math.sin(a1);
    const hx = ex + sd * 32 * Math.cos(a2), hy = ey - 32 * Math.sin(a2);
    c.strokeStyle = line; c.lineWidth = 9; c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.lineTo(hx, hy); c.stroke();
    c.strokeStyle = skinL; c.lineWidth = 5.4; c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.lineTo(hx, hy); c.stroke();
    // três dedos compridos
    const dir = Math.atan2(hy - ey, hx - ex);
    for (const k of [-.55, 0, .55]) {
      const fx = hx + Math.cos(dir + k) * 13, fy = hy + Math.sin(dir + k) * 13;
      c.strokeStyle = line; c.lineWidth = 4.2; c.beginPath(); c.moveTo(hx, hy); c.lineTo(fx, fy); c.stroke();
      c.strokeStyle = skinL; c.lineWidth = 2.2; c.beginPath(); c.moveTo(hx, hy); c.lineTo(fx, fy); c.stroke();
    }
  }
  // ---- pescoço ----
  c.fillStyle = skinD; c.fillRect(-5, -14, 10, 10);
  // ---- orelhas ----
  for (const sd of [-1, 1]) {
    c.fillStyle = skinD; c.strokeStyle = line; c.lineWidth = 2.4;
    c.beginPath(); c.moveTo(sd * 27, -64); c.bezierCurveTo(sd * 46, -70 - ear * .5, sd * 66, -88 - ear, sd * 76, -92 - ear);
    c.bezierCurveTo(sd * 70, -66, sd * 54, -40, sd * 30, -38); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = hit ? '#e8a0a0' : '#eeaacb';
    c.beginPath(); c.moveTo(sd * 32, -60); c.bezierCurveTo(sd * 48, -66 - ear * .4, sd * 60, -80 - ear * .8, sd * 68, -84 - ear * .8);
    c.bezierCurveTo(sd * 62, -64, sd * 50, -46, sd * 34, -44); c.closePath(); c.fill();
  }
  // ---- cabeça ----
  const gh = c.createLinearGradient(0, -80, 0, -4); gh.addColorStop(0, skinL); gh.addColorStop(1, skinD);
  c.fillStyle = gh; c.strokeStyle = line; c.lineWidth = 2.6;
  c.beginPath(); c.moveTo(0, -82); c.bezierCurveTo(34, -82, 42, -50, 24, -22); c.bezierCurveTo(16, -10, 7, -5, 0, -5);
  c.bezierCurveTo(-7, -5, -16, -10, -24, -22); c.bezierCurveTo(-42, -50, -34, -82, 0, -82); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.22)'; c.beginPath(); c.ellipse(-8, -70, 12, 6, -.4, 0, 7); c.fill();
  // ---- olhos enormes ----
  const look = (o.vx || 0) * 3;
  for (const sd of [-1, 1]) {
    c.save(); c.translate(sd * 15, -44); c.rotate(sd * .22);
    if (hit) {
      c.strokeStyle = line; c.lineWidth = 3.4; c.beginPath(); c.moveTo(-8, -8); c.lineTo(8, 8); c.moveTo(8, -8); c.lineTo(-8, 8); c.stroke();
    } else {
      c.scale(1, blink);
      const ge = c.createRadialGradient(-2, -4, 1, 0, 0, 16); ge.addColorStop(0, '#3a3560'); ge.addColorStop(1, '#0a0716');
      c.fillStyle = ge; c.beginPath(); c.ellipse(0, 0, 11.5, 15, 0, 0, 7); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.ellipse(-3.5 + look, -6, 3.6, 4.6, 0, 0, 7); c.fill();
      c.beginPath(); c.arc(3.5 + look * .6, 6, 1.9, 0, 7); c.fill();
    }
    c.restore();
  }
  // ---- nariz e boca ----
  c.fillStyle = line; c.beginPath(); c.arc(-2.4, -24, 1.1, 0, 7); c.arc(2.4, -24, 1.1, 0, 7); c.fill();
  c.strokeStyle = line; c.lineWidth = 2; c.beginPath();
  if (hit) c.ellipse(0, -15, 3, 4, 0, 0, 7); else { c.moveTo(-5, -17); c.quadraticCurveTo(0, -12.5, 5, -17); }
  c.stroke();
  c.restore();
}

/* ================= JOGO: FAGULHA — CAVERNA DE GELO ================= */
const cv = document.getElementById('game'), c = cv.getContext('2d');
if (!c.roundRect) c.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };   // navegadores antigos
const W = 420, H = 640;
const PY = 190;                 // altura fixa do Fagulha na tela (o cenário é que sobe)
const VEL = 240;                // velocidade da queda (pixels por segundo)
const META = 6000;              // distância até o fundo (6000 = 600 m)
const CRISTAIS_POR_VIDA = 15;   // junta 15 cristais pra recuperar 1 coração perdido
const IMA_MAX = 8;              // só existem 8 ímãs na fase inteira
const IMA_DURACAO = 20;         // o poder do ímã dura 20 segundos quando ativado
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const toque = matchMedia('(hover: none) and (pointer: coarse)').matches;   // é celular?

// formato da parede de gelo (fica ondulada e irregular)
const borda = y => 34 + 9 * Math.sin(y * .013) + 5 * Math.sin(y * .041 + 1) + 3 * Math.sin(y * .11);

// paleta de cada fase: 1 = caverna de gelo (minas de ouro), 2 = minas de cristal
const TEMA = {
  1: { ceu1: '#0f3456', ceu2: '#0a2340', ceu3: '#06142a', parede1: '#2a6d9c', parede2: '#7cc6ea', parede3: '#e6f8ff',
       bloco1: '#ffffff', bloco2: '#bff0ff', bloco3: '#4fb0e0', veio: '255,210,58', veioClara: '255,232,150', brilho: 'rgba(120,255,200,.10)' },
  2: { ceu1: '#3a1550', ceu2: '#260e38', ceu3: '#13051e', parede1: '#6a2f8f', parede2: '#c27bf0', parede3: '#f6e6ff',
       bloco1: '#ffffff', bloco2: '#e3c6ff', bloco3: '#a24fe0', veio: '122,246,255', veioClara: '200,250,255', brilho: 'rgba(230,140,255,.12)' }
};

let estado = 'inicio';          // inicio | jogando | gameover | vitoria
let fase = 1;                   // 1 = caverna de gelo (ouro)   2 = minas de cristal (ímã)
let t = 0, dist = 0;
let vidas = 3, invenc = 0, cristais = 0, cristaisVida = 0, ouro = 0, derretidos = 0, shake = 0;
let imasSpawned = 0, imaColetados = 0, imaCarga = 0, imaAtivo = 0;
let nevasca = false, nevT = 0, terremoto = false, termT = 0, banner = null, fogo = false;
const jog = { x: W / 2, vx: 0 };
let obst = [], gems = [], ouros = [], imas = [], fx = [], neve = [];
let spawnT = 1, gemT = 1, ouroT = 3, imaT = 6;
const keys = { left: false, right: false, fogo: false };

function resetar() {
  estado = 'jogando'; fase = 1; t = 0; dist = 0; vidas = 3; invenc = 0; cristais = 0; cristaisVida = 0; ouro = 0; derretidos = 0; shake = 0;
  imasSpawned = 0; imaColetados = 0; imaCarga = 0; imaAtivo = 0;
  nevasca = false; nevT = 0; terremoto = false; termT = 0; fogo = false;
  jog.x = W / 2; jog.vx = 0; obst = []; gems = []; ouros = []; imas = []; fx = [];
  spawnT = 1.5; gemT = 1; ouroT = 3; imaT = 6;
  banner = { txt: 'FASE 1: CAVERNA DE GELO', sub: toque ? 'BOTÃO 🔥 = JATO DE FOGO' : 'ESPAÇO = JATO DE FOGO', t: 2.6 };
  atualizarBotaoFogo();
}

function avancarFase() {
  fase = 2; dist = 0; obst = []; gems = []; ouros = []; imas = []; fx = [];
  spawnT = 1.5; gemT = 1; ouroT = 3; imaT = 4; nevasca = false; nevT = 0; terremoto = false; termT = 0;
  banner = { txt: 'FASE 2: SEM FOGO!', sub: 'ESPAÇO ATIVA O ÍMÃ 🧲 POR 20s', t: 3 };
  atualizarBotaoFogo();
}

/* ---------- troca o ícone do botão de toque: 🔥 na fase 1, 🧲 na fase 2 ---------- */
function atualizarBotaoFogo() {
  const b = document.getElementById('btnFogo');
  b.textContent = fase === 2 ? '🧲' : '🔥';
  b.style.background = fase === 2 ? '#6a2f8f' : '#ff7a2a';
  b.style.boxShadow = fase === 2 ? '0 4px 0 #3a1a52' : '0 4px 0 #9a3c08';
}

/* ---------- tenta ativar o poder do ímã (só na fase 2, se tiver carga guardada) ---------- */
function tentarAtivarIma() {
  if (fase === 2 && estado === 'jogando' && imaCarga > 0 && imaAtivo <= 0) {
    imaCarga--; imaAtivo = IMA_DURACAO; burst(jog.x, PY, '#9ad8ff', 14, 130);
    banner = { txt: '🧲 ÍMÃ ATIVADO!', sub: 'PUXA CRISTAIS POR 20s', t: 2 };
  }
}

/* ---------- obstáculos de gelo/rocha (e minas de ouro na fase 1) ---------- */
function criarObstaculo() {
  const r = Math.random(), lado = Math.random() < .5 ? -1 : 1;
  let o;
  if (fase === 2) {
    // fase 2 não tem fogo, então não tem minas pra quebrar - só obstáculos pra desviar
    if (r < .3) o = { tp: 'lateral', lado, w: rnd(110, 170), h: 34 };          // espinhos saindo da parede
    else if (r < .55) o = { tp: 'bloco', w: rnd(58, 84), h: rnd(48, 62) };     // bloco de cristal
    else o = { tp: 'espinho', w: rnd(56, 96), h: rnd(48, 66) };                 // espinhos de cristal
  } else {
    if (r < .2) o = { tp: 'lateral', lado, w: rnd(110, 170), h: 34 };          // espinhos saindo da parede
    else if (r < .36) o = { tp: 'bloco', w: rnd(58, 84), h: rnd(48, 62) };      // bloco de gelo
    else if (r < .5) o = { tp: 'mina', w: rnd(60, 86), h: rnd(50, 64) };        // mina de ouro
    else o = { tp: 'espinho', w: rnd(56, 96), h: rnd(48, 66) };                  // espinhos de gelo
  }
  o.x = o.lado ? (o.lado < 0 ? 34 + o.w / 2 : W - 34 - o.w / 2) : rnd(50 + o.w / 2, W - 50 - o.w / 2);
  o.y = H + 40; o.hp = (o.tp === 'bloco' || o.tp === 'mina') ? .7 : .4; o.max = o.hp; o.sd = Math.random();
  obst.push(o);
}

function desenharObstaculo(o) {
  c.save(); c.translate(o.x, o.y); c.lineJoin = 'round';
  const derrete = 1 - o.hp / o.max;            // fica vermelhinho quando o fogo pega
  const T = TEMA[fase];
  if (o.tp === 'espinho') {
    // 3 espinhos apontando pra cima
    const bw = o.w / 3;
    for (let i = 0; i < 3; i++) {
      const bx = -o.w / 2 + i * bw, alt = o.h * (i === 1 ? 1 : .6 + o.sd * .3);
      const g = c.createLinearGradient(0, o.h / 2 - alt, 0, o.h / 2);
      g.addColorStop(0, T.bloco1); g.addColorStop(.5, T.bloco2); g.addColorStop(1, T.bloco3);
      c.fillStyle = g; c.strokeStyle = '#1d5f8a'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(bx, o.h / 2); c.lineTo(bx + bw / 2, o.h / 2 - alt); c.lineTo(bx + bw, o.h / 2); c.closePath(); c.fill(); c.stroke();
      // brilho em cada espinho
      c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(bx + bw * .4, o.h / 2 - 4); c.lineTo(bx + bw / 2, o.h / 2 - alt + 6); c.stroke();
    }
    // montinho de neve/pó na base
    c.fillStyle = '#f2fbff';
    c.beginPath(); c.ellipse(0, o.h / 2, o.w / 2 + 4, 8, 0, Math.PI, 0); c.fill();
  } else if (o.tp === 'lateral') {
    const b = o.lado * o.w / 2, d = -o.lado;   // b = ponto na parede, d = direção pro meio
    for (const [dy, len] of [[-11, .55], [0, 1], [11, .75]]) {
      const g = c.createLinearGradient(b, 0, b + d * o.w * len, 0);
      g.addColorStop(0, T.parede2); g.addColorStop(1, T.bloco1);
      c.fillStyle = g; c.strokeStyle = '#1d5f8a'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(b, dy - 9); c.lineTo(b + d * o.w * len, dy); c.lineTo(b, dy + 9); c.closePath(); c.fill(); c.stroke();
    }
  } else if (o.tp === 'bloco') {
    // bloco transparente com rachaduras
    const g = c.createLinearGradient(-o.w / 2, -o.h / 2, o.w / 2, o.h / 2);
    g.addColorStop(0, 'rgba(230,250,255,.95)'); g.addColorStop(1, `${T.bloco3}dd`);
    c.fillStyle = g; c.strokeStyle = '#1d5f8a'; c.lineWidth = 2.4;
    c.beginPath(); c.roundRect(-o.w / 2, -o.h / 2, o.w, o.h, 6); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(-o.w / 2 + 8, -o.h / 2 + 8); c.lineTo(-o.w / 2 + 22, -o.h / 2 + 8); c.stroke();
    c.strokeStyle = 'rgba(30,90,140,.6)'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(-o.w * .1, -o.h / 2); c.lineTo(0, -o.h * .1); c.lineTo(-o.w * .15, o.h * .15); c.lineTo(o.w * .05, o.h / 2); c.stroke();
    c.fillStyle = '#f2fbff'; c.fillRect(-o.w / 2, -o.h / 2 - 3, o.w, 6);   // neve/pó em cima
  } else if (o.tp === 'mina') {
    // bloco com um veio brilhando dentro — fase 1 = ouro, fase 2 = cristal — e solta prêmios ao quebrar
    const g = c.createLinearGradient(-o.w / 2, -o.h / 2, o.w / 2, o.h / 2);
    g.addColorStop(0, 'rgba(220,235,250,.95)'); g.addColorStop(1, `${T.parede1}e6`);
    c.fillStyle = g; c.strokeStyle = '#1d5f8a'; c.lineWidth = 2.4;
    c.beginPath(); c.roundRect(-o.w / 2, -o.h / 2, o.w, o.h, 6); c.fill(); c.stroke();
    // veio ondulado, mais forte quanto mais perto de quebrar
    c.save(); c.beginPath(); c.roundRect(-o.w / 2 + 3, -o.h / 2 + 3, o.w - 6, o.h - 6, 5); c.clip();
    c.strokeStyle = `rgba(${T.veio},${.55 + derrete * .4})`; c.lineWidth = 6;
    c.beginPath(); c.moveTo(-o.w / 2, -o.h * .1);
    c.quadraticCurveTo(0, o.h * .25, o.w / 2, -o.h * .2); c.stroke();
    c.fillStyle = `rgba(${T.veioClara},${.5 + derrete * .4})`;
    for (const px of [-.25, .1, .35]) { c.beginPath(); c.arc(px * o.w, Math.sin(px * 6) * o.h * .15, 4, 0, 7); c.fill(); }
    c.restore();
    c.fillStyle = '#f2fbff'; c.fillRect(-o.w / 2, -o.h / 2 - 3, o.w, 6);   // neve/pó em cima
  }
  if (derrete > 0) { c.globalCompositeOperation = 'source-atop'; c.fillStyle = `rgba(255,120,40,${derrete * .6})`; c.fillRect(-o.w, -o.h, o.w * 2, o.h * 2); }
  c.restore();
}

/* ---------- partículas ---------- */
function burst(x, y, cor, n, v) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = rnd(30, v || 140); fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(.3, .7), max: .7, cor, r: rnd(1.5, 3.6) }); }
}
const CORES_FOGO = ['#fff3a0', '#ffd23a', '#ffb02a', '#ff6a1a', '#ff3a10'];

/* ---------- soltar pepitas de ouro quando uma mina derrete (fase 1) ---------- */
function soltarOuro(x, y) {
  const n = Math.floor(rnd(1, 4));
  for (let i = 0; i < n; i++) ouros.push({ x: clamp(x + rnd(-24, 24), 40, W - 40), y: y + rnd(-10, 10), vy: rnd(-60, -20) });
}

/* ---------- soltar cristais extras quando uma mina quebra (fase 2) ---------- */
function soltarCristalMina(x, y) {
  const n = Math.floor(rnd(2, 5));
  for (let i = 0; i < n; i++) gems.push({ x: clamp(x + rnd(-24, 24), 40, W - 40), y: y + rnd(-10, 10) });
}

/* ---------- neve caindo (fica forte na nevasca) ---------- */
const vento = () => Math.sin(t * 1.3);
function novaNeve(y) {
  return { x: rnd(0, W), y, vx: rnd(-20, 20), vy: -VEL * rnd(.3, .8), r: rnd(1.2, 3.4), a: rnd(.4, 1) };
}
for (let i = 0; i < 60; i++) neve.push(novaNeve(rnd(0, H)));

/* ---------- entrada: teclado ---------- */
addEventListener('keydown', e => {
  const k = e.code;
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Tab'].includes(k)) e.preventDefault();
  if (estado !== 'jogando') { if (!e.repeat && (k === 'Space' || k === 'Enter' || k === 'KeyR')) resetar(); return; }
  if (k === 'ArrowLeft' || k === 'KeyA') keys.left = true;
  if (k === 'ArrowRight' || k === 'KeyD') keys.right = true;
  if (k === 'Space') { keys.fogo = true; if (!e.repeat) tentarAtivarIma(); }
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'Space') keys.fogo = false;
});

/* ---------- entrada: botões de toque ---------- */
function botao(id, tecla) {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); if (estado !== 'jogando') { resetar(); return; } keys[tecla] = true; });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => keys[tecla] = false);
}
botao('btnEsq', 'left'); botao('btnDir', 'right');
const btnFogo = document.getElementById('btnFogo');
btnFogo.addEventListener('pointerdown', e => { e.preventDefault(); if (estado !== 'jogando') { resetar(); return; } keys.fogo = true; tentarAtivarIma(); });
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) btnFogo.addEventListener(ev, () => keys.fogo = false);
cv.addEventListener('pointerdown', () => { if (estado !== 'jogando') resetar(); });

/* ---------- atualização ---------- */
function update(dt) {
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  // a neve continua caindo até nas telas de início e fim
  for (const p of neve) {
    if (nevasca) p.vx += (260 * vento() - p.vx) * dt * 2;
    p.x += p.vx * dt; p.y += p.vy * dt * (nevasca ? 1.8 : 1);
    if (p.x < 0) p.x += W; if (p.x > W) p.x -= W;
  }
  neve = neve.filter(p => p.y > -10);
  const alvo = nevasca ? 220 : 60;
  for (let i = 0; i < 8 && neve.length < alvo; i++) neve.push(novaNeve(H + rnd(0, 20)));

  if (estado !== 'jogando') return;
  t += dt;
  dist += VEL * dt;
  if (invenc > 0) invenc -= dt;
  if (shake > 0) shake -= dt;
  if (imaAtivo > 0) imaAtivo -= dt;

  // ---- fase 1: nevasca a cada 16s (dura 7s)   •   fase 2: terremoto de espinhos de cristal a cada 30s (dura 6s) ----
  if (fase === 1) {
    nevT += dt;
    const ciclo = nevT % 16;
    const nv = ciclo > 9;
    if (nv && !nevasca) banner = { txt: 'NEVASCA!', sub: 'CUIDADO COM O VENTO', t: 2.4 };
    nevasca = nv;
  } else {
    termT += dt;
    const ciclo = termT % 30;
    const tr = ciclo > 24;
    if (tr && !terremoto) banner = { txt: 'TERREMOTO DE CRISTAL!', sub: 'ESPINHOS CAINDO - CUIDADO!', t: 2.4 };
    terremoto = tr;
    if (terremoto) {
      shake = Math.max(shake, .16);
      if (Math.random() < dt * 5) burst(rnd(40, W - 40), rnd(100, 400), '#d9b8ff', 4, 70);
      // chove espinho de cristal extra direto, além dos obstáculos normais
      if (Math.random() < dt * 2) {
        const o = { tp: 'espinho', w: rnd(50, 80), h: rnd(50, 70) };
        o.x = rnd(50 + o.w / 2, W - 50 - o.w / 2); o.y = H + 40; o.hp = .4; o.max = .4; o.sd = Math.random();
        obst.push(o);
      }
    }
  }

  // ---- fogo infinito: é só segurar ESPAÇO (na fase 2 o poder de fogo é desligado) ----
  fogo = fase === 2 ? false : keys.fogo;

  // ---- movimento do Fagulha ----
  const ax = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
  jog.vx += (ax * 300 - jog.vx) * Math.min(1, dt * 10);
  const empurrao = nevasca ? vento() * 95 : 0;   // o vento da nevasca empurra!
  const lim = borda(dist + PY) + 12;
  jog.x = clamp(jog.x + (jog.vx + empurrao) * dt, lim, W - lim);

  // ---- obstáculos ----
  spawnT -= dt;
  const corre = nevasca || terremoto;
  if (spawnT <= 0) { criarObstaculo(); spawnT = (corre ? .6 : .95) * rnd(.8, 1.2); }
  for (const o of obst) o.y -= VEL * dt;

  // ---- jato de fogo derrete o gelo (e as minas de ouro) embaixo do Fagulha ----
  if (fogo) {
    const bx1 = jog.x - 26, bx2 = jog.x + 26, by1 = PY + 30, by2 = PY + 280;
    for (const o of obst) {
      if (o.morto) continue;
      if (o.x + o.w / 2 > bx1 && o.x - o.w / 2 < bx2 && o.y + o.h / 2 > by1 && o.y - o.h / 2 < by2) {
        o.hp -= dt;
        if (Math.random() < .5) burst(o.x + rnd(-o.w / 3, o.w / 3), o.y - o.h / 3, '#dff6ff', 1, 70);   // vapor
        if (o.hp <= 0) {
          o.morto = true; derretidos++;
          burst(o.x, o.y, '#ff8a2a', 14, 170); burst(o.x, o.y, '#bfe9ff', 16, 140);
          if (o.tp === 'mina') {
            if (fase === 1) { soltarOuro(o.x, o.y); burst(o.x, o.y, '#ffd23a', 12, 150); }
            else { soltarCristalMina(o.x, o.y); burst(o.x, o.y, '#7af6ff', 12, 150); }
          }
        }
      }
    }
    // partículas de fogo saindo do Fagulha
    for (let i = 0; i < 5; i++)
      fx.push({ x: jog.x + rnd(-6, 6), y: PY + 30, vx: rnd(-50, 50), vy: rnd(400, 540), life: rnd(.3, .5), max: .5,
        cor: CORES_FOGO[Math.floor(Math.random() * CORES_FOGO.length)], r: rnd(3, 7.5) });
  }
  obst = obst.filter(o => o.y > -100 && !o.morto);

  // ---- cristais ----
  gemT -= dt;
  if (gemT <= 0) { gems.push({ x: rnd(60, W - 60), y: H + 30 }); gemT = .75; }
  for (const g of gems) g.y -= VEL * dt;
  // ---- ímã: puxa cristais e ouro de perto pro Fagulha ----
  if (imaAtivo > 0) {
    for (const g of gems) { const dx = jog.x - g.x, dy = (PY + 4) - g.y, d = Math.hypot(dx, dy); if (d < 160 && d > 1) { g.x += dx / d * 260 * dt; g.y += dy / d * 260 * dt; } }
    for (const g of ouros) { const dx = jog.x - g.x, dy = (PY + 4) - g.y, d = Math.hypot(dx, dy); if (d < 160 && d > 1) { g.x += dx / d * 260 * dt; g.y += dy / d * 260 * dt; } }
  }
  gems = gems.filter(g => {
    if (Math.abs(g.x - jog.x) < 28 && Math.abs(g.y - (PY + 4)) < 44) {
      cristais++; cristaisVida++; burst(g.x, g.y, '#7af6ff', 8, 90);
      if (cristaisVida >= CRISTAIS_POR_VIDA && vidas < 3) {
        vidas++; cristaisVida = 0; burst(jog.x, PY, '#ff5577', 18, 160);
        banner = { txt: '❤️ VIDA RECUPERADA!', sub: 'CONTINUE JUNTANDO CRISTAIS', t: 2 };
      }
      return false;
    }
    return g.y > -30;
  });

  // ---- ouro das minas ----
  for (const g of ouros) { g.vy += 300 * dt; g.y -= VEL * dt - g.vy * dt; }
  ouros = ouros.filter(g => {
    if (Math.abs(g.x - jog.x) < 28 && Math.abs(g.y - (PY + 4)) < 44) { ouro++; burst(g.x, g.y, '#ffd23a', 10, 110); return false; }
    return g.y > -30;
  });

  // ---- ímã (power-up): só aparece na fase 2, e só existem 8 na fase inteira ----
  imaT -= dt;
  if (fase === 2 && imaT <= 0 && imasSpawned < IMA_MAX) { imas.push({ x: rnd(60, W - 60), y: H + 30 }); imasSpawned++; imaT = rnd(7, 11); }
  for (const g of imas) g.y -= VEL * dt;
  imas = imas.filter(g => {
    if (Math.abs(g.x - jog.x) < 30 && Math.abs(g.y - (PY + 4)) < 46) {
      imaColetados++; imaCarga++; burst(g.x, g.y, '#9ad8ff', 14, 130);
      banner = { txt: '🧲 ÍMÃ GUARDADO!', sub: 'APERTE ESPAÇO PRA USAR', t: 2 };
      return false;
    }
    return g.y > -30;
  });

  // ---- colisões ----
  const hb = { x: jog.x - 15, y: PY - 26, w: 30, h: 58 };
  for (const o of obst) {
    const ox = o.x - o.w * .42, oy = o.y - o.h * .42, ow = o.w * .84, oh = o.h * .84;
    if (hb.x < ox + ow && hb.x + hb.w > ox && hb.y < oy + oh && hb.y + hb.h > oy) {
      if (invenc > 0) continue;
      levarDano(o);
      break;
    }
  }
  obst = obst.filter(o => !o.morto);

  // ---- partículas ----
  for (const p of fx) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .96; p.vy *= .96; p.life -= dt; }
  fx = fx.filter(p => p.life > 0);

  // ---- fim de fase / fim de jogo ----
  if (dist >= META) {
    if (fase === 1) avancarFase();
    else { estado = 'vitoria'; nevasca = false; }
  }
}

function levarDano(o) {
  vidas--; invenc = 1.5; shake = .3; burst(jog.x, PY, '#ff5577', 16, 180);
  if (o) o.morto = true;
  if (vidas <= 0) { estado = 'gameover'; nevasca = false; }
}

/* ---------- cenário: caverna de gelo (fase 1) ou minas de cristal (fase 2) ---------- */
function fundo() {
  const T = TEMA[fase];
  // céu da caverna
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, T.ceu1); g.addColorStop(.6, T.ceu2); g.addColorStop(1, T.ceu3);
  c.fillStyle = g; c.fillRect(0, 0, W, H);

  // brilho mágico lá no fundo (aurora de gelo ou névoa de cristal)
  for (let k = 0; k < 3; k++) {
    c.strokeStyle = [T.brilho, 'rgba(120,200,255,.09)', 'rgba(190,140,255,.07)'][k];
    c.lineWidth = 40 - k * 8;
    c.beginPath();
    for (let x = -20; x <= W + 20; x += 20) c.lineTo(x, 120 + k * 50 + Math.sin(x * .015 + t * .6 + k) * 30);
    c.stroke();
  }

  // colunas distantes (andam mais devagar = profundidade): gelo na fase 1, cristais facetados na fase 2
  const p1 = (dist * .35) % 260;
  for (let k = -1; k < 4; k++) {
    for (const [cx, w] of [[110, 46], [300, 60]]) {
      const y = k * 260 - p1 + (cx === 300 ? 130 : 0);
      if (fase === 2) {
        // aglomerado de cristais pontudos saindo da rocha
        for (const [dx, dw, dh] of [[-w * .22, w * .55, 180], [w * .2, w * .65, 230], [0, w * .4, 130]]) {
          const gc = c.createLinearGradient(cx + dx - dw / 2, y, cx + dx + dw / 2, y + dh);
          gc.addColorStop(0, 'rgba(230,190,255,.22)'); gc.addColorStop(.5, 'rgba(190,120,240,.18)'); gc.addColorStop(1, 'rgba(120,60,180,.04)');
          c.fillStyle = gc;
          c.beginPath();
          c.moveTo(cx + dx, y); c.lineTo(cx + dx - dw / 2, y + dh * .45); c.lineTo(cx + dx - dw * .18, y + dh);
          c.lineTo(cx + dx + dw * .18, y + dh); c.lineTo(cx + dx + dw / 2, y + dh * .45); c.closePath(); c.fill();
          c.strokeStyle = 'rgba(255,255,255,.2)'; c.lineWidth = 1;
          c.beginPath(); c.moveTo(cx + dx, y); c.lineTo(cx + dx - dw * .1, y + dh * .6); c.stroke();
        }
      } else {
        const gc = c.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
        gc.addColorStop(0, 'rgba(150,215,255,.05)'); gc.addColorStop(.5, 'rgba(200,240,255,.14)'); gc.addColorStop(1, 'rgba(150,215,255,.05)');
        c.fillStyle = gc;
        c.beginPath(); c.moveTo(cx - w / 2, y); c.lineTo(cx, y - 40); c.lineTo(cx + w / 2, y); c.lineTo(cx + w / 2 - 6, y + 200); c.lineTo(cx, y + 230); c.lineTo(cx - w / 2 + 6, y + 200); c.closePath(); c.fill();
      }
    }
  }

  // cristais pequenos brilhando no fundo (mais deles e mais roxos na fase 2)
  const qtdBrilho = fase === 2 ? 22 : 14;
  for (let k = 0; k < qtdBrilho; k++) {
    const sx = (k * 97) % (W - 100) + 50, sy = ((k * 173 - dist * .5) % (H + 40) + H + 40) % (H + 40) - 20;
    c.globalAlpha = .35 + .35 * Math.sin(t * 3 + k); c.fillStyle = fase === 2 ? '#e8c6ff' : '#e8fbff';
    c.beginPath(); c.moveTo(sx, sy - 4); c.lineTo(sx + 2, sy); c.lineTo(sx, sy + 4); c.lineTo(sx - 2, sy); c.fill();
  }
  c.globalAlpha = 1;

  // paredes irregulares dos dois lados (gelo ou rocha de cristal)
  for (const sd of [-1, 1]) {
    const gw = c.createLinearGradient(sd < 0 ? 0 : W, 0, sd < 0 ? 50 : W - 50, 0);
    gw.addColorStop(0, T.parede1); gw.addColorStop(.7, T.parede2); gw.addColorStop(1, T.parede3);
    c.fillStyle = gw;
    c.beginPath(); c.moveTo(sd < 0 ? 0 : W, -20);
    for (let sy = -20; sy <= H + 20; sy += 16) { const b = borda(sy + dist); c.lineTo(sd < 0 ? b : W - b, sy); }
    c.lineTo(sd < 0 ? 0 : W, H + 20); c.closePath(); c.fill();
    // borda brilhante
    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 2;
    c.beginPath();
    for (let sy = -20; sy <= H + 20; sy += 16) { const b = borda(sy + dist); c.lineTo(sd < 0 ? b : W - b, sy); }
    c.stroke();
  }

  // pingentes de gelo (ou pontas de cristal) pendurados nas paredes
  const passo = 90, ini = Math.floor(dist / passo) - 1;
  for (let k = ini; k < ini + H / passo + 3; k++) {
    const wy = k * passo, sy = wy - dist;
    for (const sd of [-1, 1]) {
      if ((k + (sd > 0 ? 1 : 0)) % 2) continue;
      const b = borda(wy), x = sd < 0 ? b : W - b, len = 14 + (k * 7 % 10);
      c.fillStyle = T.parede3; c.strokeStyle = 'rgba(40,40,80,.6)'; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(x, sy - 6); c.lineTo(x - sd * len, sy); c.lineTo(x, sy + 6); c.closePath(); c.fill(); c.stroke();
    }
  }
}

function desenharNeve() {
  c.fillStyle = fase === 2 ? '#e3c6ff' : '#ffffff';   // poeira de cristal na fase 2, neve na fase 1
  for (const p of neve) { c.globalAlpha = p.a; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); }
  c.globalAlpha = 1;
}

function desenharJato() {
  if (!fogo || estado !== 'jogando') return;
  // cone de fogo saindo pra baixo
  const g = c.createLinearGradient(0, PY + 30, 0, PY + 280);
  g.addColorStop(0, 'rgba(255,245,170,.95)'); g.addColorStop(.35, 'rgba(255,150,40,.75)'); g.addColorStop(1, 'rgba(255,50,0,0)');
  c.globalAlpha = .75 + Math.sin(t * 40) * .15;
  c.fillStyle = g; c.beginPath();
  c.moveTo(jog.x - 6, PY + 30);
  c.quadraticCurveTo(jog.x - 30 + Math.sin(t * 30) * 4, PY + 160, jog.x - 26, PY + 280);
  c.lineTo(jog.x + 26, PY + 280);
  c.quadraticCurveTo(jog.x + 30 + Math.sin(t * 27) * 4, PY + 160, jog.x + 6, PY + 30);
  c.closePath(); c.fill();
  c.globalAlpha = 1;
}

function desenharOuro(g) {
  c.save(); c.translate(g.x, g.y); c.rotate(Math.sin(t * 2.5 + g.x) * .25);
  const grd = c.createLinearGradient(-9, -7, 9, 7);
  grd.addColorStop(0, '#fff3a0'); grd.addColorStop(.5, '#ffd23a'); grd.addColorStop(1, '#c98a0e');
  c.fillStyle = grd; c.strokeStyle = '#7a4d08'; c.lineWidth = 1.6;
  c.beginPath(); c.ellipse(0, 0, 9, 6.5, 0, 0, 7); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.ellipse(-2.5, -1.5, 2.6, 1.4, -.4, 0, 7); c.fill();
  c.restore();
}

function desenharIma(g) {
  c.save(); c.translate(g.x, g.y + Math.sin(t * 4 + g.x) * 4);
  c.font = '26px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.shadowColor = '#9ad8ff'; c.shadowBlur = 12;
  c.fillText('🧲', 0, 0);
  c.restore();
}

function desenhar() {
  c.save();
  if (shake > 0) c.translate(rnd(-5, 5), rnd(-5, 5));
  fundo();

  for (const g of gems) {
    c.save(); c.translate(g.x, g.y); c.rotate(Math.sin(t * 3 + g.x) * .3);
    c.fillStyle = '#7af6ff'; c.beginPath(); c.moveTo(0, -11); c.lineTo(8, 0); c.lineTo(0, 11); c.lineTo(-8, 0); c.closePath(); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.moveTo(-1, -8); c.lineTo(3, -1); c.lineTo(-3, -1); c.fill(); c.restore();
  }
  for (const g of ouros) desenharOuro(g);
  for (const g of imas) desenharIma(g);
  for (const o of obst) desenharObstaculo(o);
  desenharJato();

  // ---- o Fagulha ----
  const piscando = invenc > 0 && Math.floor(t * 14) % 2 === 0;
  if (estado === 'jogando') {
    // auréola azul enquanto o ímã está ativo
    if (imaAtivo > 0) {
      c.save(); c.globalAlpha = .18 + Math.sin(t * 10) * .05;
      const ga = c.createRadialGradient(jog.x, PY, 10, jog.x, PY, 160);
      ga.addColorStop(0, '#9ad8ff'); ga.addColorStop(1, 'rgba(154,216,255,0)');
      c.fillStyle = ga; c.beginPath(); c.arc(jog.x, PY, 160, 0, 7); c.fill(); c.restore();
    }
    drawFagulha(c, jog.x, PY + 12, .42, t, {
      vx: clamp(jog.vx / 300, -1, 1), hit: invenc > 1.2,
      glow: fogo ? '#ff8a2a' : '#ffe9a8',
      alpha: piscando ? .3 : 1 });
  }
  for (const p of fx) { c.globalAlpha = clamp(p.life / p.max, 0, 1); c.fillStyle = p.cor; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); }
  c.globalAlpha = 1;
  desenharNeve();

  // névoa branca da nevasca ou poeira do terremoto
  if (nevasca) { c.fillStyle = 'rgba(225,242,255,.2)'; c.fillRect(0, 0, W, H); }
  if (terremoto) { c.fillStyle = 'rgba(150,100,180,.15)'; c.fillRect(0, 0, W, H); }
  // geada nos cantos da tela
  const v = c.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .75);
  v.addColorStop(0, 'rgba(200,240,255,0)'); v.addColorStop(1, 'rgba(200,240,255,.35)');
  c.fillStyle = v; c.fillRect(0, 0, W, H);
  c.restore();
  hud();
  telas();
}

/* ---------- HUD e telas ---------- */
function texto(txt, x, y, tam, cor, al) {
  c.font = `${tam}px 'Press Start 2P', monospace`; c.textAlign = al || 'center'; c.textBaseline = 'middle';
  c.lineWidth = Math.max(3, tam / 4); c.strokeStyle = '#06142a'; c.strokeText(txt, x, y); c.fillStyle = cor; c.fillText(txt, x, y);
}
function hud() {
  if (estado === 'inicio') return;
  c.font = '20px sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle';
  for (let i = 0; i < 3; i++) c.fillText(i < vidas ? '❤️' : '🖤', 12 + i * 26, 22);
  // barrinha mostrando quanto falta de cristal pra ganhar um coração
  if (vidas < 3) {
    c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(12, 34, 70, 7);
    c.fillStyle = '#7af6ff'; c.fillRect(12, 34, 70 * clamp(cristaisVida / CRISTAIS_POR_VIDA, 0, 1), 7);
  }
  texto('💎 ' + cristais, W - 14, 22, 11, '#7af6ff', 'right');
  texto('🥇 ' + ouro, W - 14, 42, 11, '#ffd23a', 'right');
  texto('FASE ' + fase, W / 2, 22, 10, '#ffe9a8');
  if (fase === 2) texto('🧲 ' + imaCarga + ' [ESPAÇO]', W / 2, 42, 9, '#9ad8ff');
  else texto('🔥 ' + derretidos, W / 2, 42, 10, '#ffb02a');
  // barra de progresso
  const pr = clamp(dist / META, 0, 1);
  c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(W - 14, 60, 6, 124);
  c.fillStyle = '#9ff0ff'; c.fillRect(W - 14, 60, 6, 124 * pr);
  texto(Math.floor(dist / 10) + ' m', W - 11, 196, 8, '#fff', 'right');
}

function telas() {
  const agora = performance.now() / 1000, pisca = Math.floor(agora * 2) % 2;
  if (estado === 'jogando' && banner) {
    c.globalAlpha = clamp(banner.t, 0, 1);
    c.fillStyle = 'rgba(6,20,42,.55)'; c.fillRect(0, 300, W, 90);
    texto(banner.txt, W / 2, 328, 15, '#bfeaff');
    texto(banner.sub, W / 2, 362, 9, '#fff');
    c.globalAlpha = 1;
  }
  if (estado === 'inicio') {
    c.fillStyle = 'rgba(4,14,30,.65)'; c.fillRect(0, 0, W, H);
    texto('FAGULHA', W / 2, 110, 30, '#ffe9a8');
    texto('MINAS DE GELO E CRISTAL', W / 2, 156, 10, '#9ff0ff');
    drawFagulha(c, W / 2, 300, .85, agora, { pose: 'stand', glow: '#ff8a2a' });
    texto(toque ? '◀ ▶ MOVER   🔥 FOGO' : '← → MOVER   ESPAÇO = FOGO', W / 2, 448, 9, '#fff');
    texto('FASE 1: CAVERNA DE GELO E OURO', W / 2, 472, 8, '#ffb02a');
    texto('FASE 2: SEM FOGO! SÓ ÍMÃ 🧲 A CADA 30s', W / 2, 496, 7, '#9ad8ff');
    if (pisca) texto(toque ? 'TOQUE PARA JOGAR' : 'APERTE ESPAÇO', W / 2, 545, 14, '#fff');
  } else if (estado === 'gameover') {
    c.fillStyle = 'rgba(30,0,10,.75)'; c.fillRect(0, 0, W, H);
    texto('CONGELOU!', W / 2, 200, 26, '#ff3355');
    texto('💎 ' + cristais + '   🥇 ' + ouro + '   🔥 ' + derretidos, W / 2, 265, 10, '#fff');
    texto('⬇ ' + Math.floor(dist / 10) + ' m', W / 2, 290, 10, '#fff');
    if (pisca) texto(toque ? 'TOQUE: JOGAR DE NOVO' : 'ESPAÇO: JOGAR DE NOVO', W / 2, 400, 11, '#fff');
  } else if (estado === 'vitoria') {
    c.fillStyle = 'rgba(0,20,40,.75)'; c.fillRect(0, 0, W, H);
    texto('SAIU DAS MINAS!', W / 2, 150, 18, '#9ff0ff');
    drawFagulha(c, W / 2, 290, .9, agora, { pose: 'cheer', glow: '#ff8a2a' });
    texto('💎 ' + cristais + '   🥇 ' + ouro + '   🔥 ' + derretidos, W / 2, 460, 12, '#ffe9a8');
    if (pisca) texto(toque ? 'TOQUE: JOGAR DE NOVO' : 'ESPAÇO: JOGAR DE NOVO', W / 2, 540, 11, '#fff');
  }
}

/* ---------- laço principal ---------- */
let ultimo = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(.033, (now - ultimo) / 1000)); ultimo = now;
  try {
    if (estado === 'inicio') t += dt;
    update(dt);
    desenhar();
  } catch (e) { console.error('Erro no jogo:', e); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
