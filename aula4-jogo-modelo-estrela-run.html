<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌟 Estrela Run — Jogo Modelo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --sky-top:#5c94fc; --sky-bottom:#a6d8ff;
    --grass:#4cbb17; --grass-light:#7ee13f; --dirt:#8b5a2b;
    --brick:#c96a2c; --coin:#ffd700; --coin-dark:#b8860b;
    --mario-red:#e52521; --mario-red-dark:#8f1414;
    --ink:#1a1a1a;
  }
  html,body {
    width:100%; height:100%;
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    display:flex; align-items:center; justify-content:center;
    font-family: 'Press Start 2P', monospace;
    overflow:hidden;
  }
  #wrap {
    position:relative;
    width:900px; max-width:96vw;
    filter: drop-shadow(0 10px 0 rgba(0,0,0,.25));
  }
  #hud {
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 18px;
    background:linear-gradient(180deg, rgba(20,20,30,.85), rgba(20,20,30,0));
    z-index:5; pointer-events:none;
    font-size:13px; letter-spacing:1px;
  }
  #hud .stat { color:#fff; text-shadow:2px 2px 0 #000; }
  #hud .stat b { color:var(--coin); font-size:15px; }
  canvas {
    display:block; width:100%; height:auto;
    background:#5c94fc;
    border:6px solid var(--ink);
    border-radius:8px;
    box-shadow: 0 0 0 3px #fff, 0 14px 0 rgba(0,0,0,.35);
  }
  #hint {
    position:absolute; bottom:10px; left:0; right:0;
    text-align:center; color:#fff; font-size:13px; letter-spacing:.3px;
    font-family:-apple-system, Segoe UI, Arial, sans-serif; font-weight:bold;
    text-shadow:2px 2px 0 #000;
    pointer-events:none; z-index:5;
  }
  #overlay {
    position:absolute; inset:0; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:16px;
    background:rgba(10,10,20,.82); border-radius:8px; z-index:10;
    text-align:center; padding:20px;
  }
  #overlay.show { display:flex; }
  #overlay h2 {
    font-size:22px; color:var(--coin); text-shadow:3px 3px 0 #000;
    letter-spacing:2px;
  }
  #overlay p { color:#fff; font-size:12px; max-width:480px; line-height:2; text-shadow:2px 2px 0 #000; }
  #overlay button {
    margin-top:6px; padding:14px 26px; font-size:12px; font-family:'Press Start 2P', monospace;
    background:var(--mario-red); color:#fff;
    border:3px solid var(--ink); border-radius:6px; cursor:pointer; letter-spacing:1px;
    box-shadow:0 5px 0 var(--mario-red-dark);
  }
  #overlay button:active { box-shadow:0 2px 0 var(--mario-red-dark); transform:translateY(3px); }
</style>
</head>
<body>

<div id="wrap">
  <div id="hud">
    <div class="stat">🪙 MOEDAS: <b id="coinVal">0</b>/<span id="coinTotal">0</span></div>
  </div>

  <canvas id="game" width="900" height="500"></canvas>

  <div id="hint">← → mover · ESPAÇO (ou ↑) pular · colete todas as moedas ✨</div>

  <div id="overlay">
    <h2 id="overlayTitle">🌟 VOCÊ VENCEU!</h2>
    <p id="overlayText">Você coletou todas as moedas da fase!</p>
    <button onclick="restart()">🔄 JOGAR DE NOVO</button>
  </div>
</div>

<script>
/* =========================================================
   ESTRELA RUN — jogo modelo (plataforma, estilo Mario BR)
   Base ainda VAZIA de propósito: personagem, plataformas e
   moedas já funcionam, mas ainda não tem pontuação, combo,
   estrela dourada, modo fúria, vitória especial ou controle
   por toque — isso é o que a turma vai construir nas Missões
   do Objetivo, uma de cada vez, em cima deste arquivo.
   ========================================================= */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---------- Mundo ----------
const LEVEL_WIDTH = 2600;
const GRAVITY = 0.62;
const GROUND_Y = 430;

let cameraX = 0;
let frame = 0;
let gameOver = false;

// ---------- Jogador (a Estrela) ----------
const player = {
  x: 60, y: 300, w: 34, h: 34,
  vx: 0, vy: 0,
  speed: 4.6, jumpForce: -13.5,
  onGround: false,
  spawnX: 60, spawnY: 300,
  facing: 1
};

// ---------- Plataformas (chão + blocos flutuantes) ----------
// x, y, w, h — y é o TOPO da plataforma. type define o desenho.
const platforms = [
  { x: 0,    y: GROUND_Y, w: 480,  h: 70, type:'ground' },
  { x: 560,  y: GROUND_Y, w: 260,  h: 70, type:'ground' },
  { x: 900,  y: GROUND_Y, w: 340,  h: 70, type:'ground' },
  { x: 1340, y: GROUND_Y, w: 200,  h: 70, type:'ground' },
  { x: 1640, y: GROUND_Y, w: 420,  h: 70, type:'ground' },
  { x: 2160, y: GROUND_Y, w: 440,  h: 70, type:'ground' },

  // blocos flutuantes (desafio de pulo)
  { x: 340,  y: 350, w: 110, h: 22, type:'block' },
  { x: 520,  y: 280, w: 90,  h: 22, type:'block' },
  { x: 760,  y: 330, w: 110, h: 22, type:'block' },
  { x: 1000, y: 250, w: 90,  h: 22, type:'block' },
  { x: 1180, y: 320, w: 110, h: 22, type:'block' },
  { x: 1420, y: 260, w: 90,  h: 22, type:'block' },
  { x: 1560, y: 200, w: 90,  h: 22, type:'block' },
  { x: 1780, y: 320, w: 110, h: 22, type:'block' },
  { x: 1960, y: 250, w: 90,  h: 22, type:'block' },
  { x: 2240, y: 330, w: 110, h: 22, type:'block' },
  { x: 2400, y: 250, w: 90,  h: 22, type:'block' },
];

// ---------- Moedas ----------
let coins = [];
function buildCoins() {
  coins = [
    {x:150,y:390},{x:220,y:390},{x:290,y:390},
    {x:365,y:320},{x:545,y:250},
    {x:620,y:390},{x:690,y:390},
    {x:785,y:300},{x:940,y:390},{x:1025,y:220},
    {x:1120,y:390},{x:1205,y:290},
    {x:1360,y:390},{x:1445,y:230},{x:1585,y:170},
    {x:1700,y:390},{x:1805,y:290},
    {x:1900,y:390},{x:1985,y:220},{x:2080,y:390},
    {x:2200,y:390},{x:2265,y:300},{x:2425,y:220},{x:2500,y:390},
  ].map(c => ({...c, r:9, collected:false}));
}
buildCoins();

// ---------- Bandeira final (decoração de chegada) ----------
const flag = { x: LEVEL_WIDTH-120, y: GROUND_Y };

// ---------- Cenário (colinas e nuvens) ----------
const hills = Array.from({length:16}, () => ({
  x: Math.random()*LEVEL_WIDTH*1.1, r: 60+Math.random()*70
}));
const clouds = Array.from({length:18}, () => ({
  x: Math.random()*LEVEL_WIDTH*1.1, y: 40+Math.random()*100, s: 0.6+Math.random()*0.9
}));

// ---------- Estado ----------
let coinCount = 0;

document.getElementById('coinTotal').textContent = coins.length;

// ---------- Input ----------
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp','Space','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function tryJump() {
  if (player.onGround) {
    player.vy = player.jumpForce;
    player.onGround = false;
  }
}

// ---------- Loop principal ----------
function update() {
  if (gameOver) return;
  frame++;

  // movimento horizontal
  if (keys['ArrowLeft'])  { player.vx = -player.speed; player.facing = -1; }
  else if (keys['ArrowRight']) { player.vx = player.speed; player.facing = 1; }
  else player.vx *= 0.75;

  if (keys['Space'] || keys['ArrowUp']) tryJump();

  // gravidade
  player.vy += GRAVITY;
  if (player.vy > 16) player.vy = 16;

  player.x += player.vx;
  player.y += player.vy;

  // limites do mundo
  if (player.x < 10) player.x = 10;
  if (player.x > LEVEL_WIDTH - player.w - 10) player.x = LEVEL_WIDTH - player.w - 10;

  // colisão com plataformas (só por cima, caindo)
  player.onGround = false;
  for (const p of platforms) {
    const withinX = player.x + player.w > p.x && player.x < p.x + p.w;
    const wasAbove = (player.y + player.h - player.vy) <= p.y + 1;
    if (withinX && player.vy >= 0 && wasAbove &&
        player.y + player.h >= p.y && player.y + player.h <= p.y + p.h + player.vy + 1) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.onGround = true;
    }
  }

  // caiu no vazio -> volta pro checkpoint mais próximo
  if (player.y > H + 60) {
    player.x = player.spawnX;
    player.y = player.spawnY;
    player.vx = 0; player.vy = 0;
  }

  // atualiza checkpoint (última plataforma sólida pisada, no chão)
  if (player.onGround && player.y + player.h >= GROUND_Y) {
    player.spawnX = player.x;
    player.spawnY = player.y - 4;
  }

  // moedas
  for (const c of coins) {
    if (c.collected) continue;
    const dx = (player.x+player.w/2) - c.x, dy = (player.y+player.h/2) - c.y;
    if (Math.sqrt(dx*dx+dy*dy) < c.r + 20) {
      c.collected = true;
      coinCount++;
      updateHUD();
      if (coinCount === coins.length) winGame();
    }
  }

  // câmera segue o jogador
  cameraX = Math.max(0, Math.min(player.x - W/2, LEVEL_WIDTH - W));
}

function updateHUD() {
  document.getElementById('coinVal').textContent = coinCount;
}

function winGame() {
  gameOver = true;
  document.getElementById('overlayTitle').textContent = '🌟 VOCÊ VENCEU!';
  document.getElementById('overlayText').textContent =
    `Você coletou todas as ${coins.length} moedas da fase!`;
  document.getElementById('overlay').classList.add('show');
}

function restart() {
  player.x = player.spawnX = 60;
  player.y = player.spawnY = 300;
  player.vx = 0; player.vy = 0;
  coinCount = 0;
  gameOver = false;
  buildCoins();
  document.getElementById('overlay').classList.remove('show');
  updateHUD();
}

// ---------- Desenho ----------
function drawCloud(x, y, s) {
  ctx.beginPath();
  ctx.ellipse(x, y, 22*s, 14*s, 0, 0, Math.PI*2);
  ctx.ellipse(x-18*s, y+4*s, 16*s, 11*s, 0, 0, Math.PI*2);
  ctx.ellipse(x+18*s, y+4*s, 16*s, 11*s, 0, 0, Math.PI*2);
  ctx.fill();
}

function drawBackground() {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#5c94fc');
  g.addColorStop(1,'#a6d8ff');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // sol
  ctx.save();
  ctx.fillStyle = '#fff35c';
  ctx.shadowColor = '#fff35c'; ctx.shadowBlur = 30;
  ctx.beginPath(); ctx.arc(W-90, 70, 36, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // colinas (parallax lento)
  ctx.fillStyle = '#3fae4a';
  for (const h of hills) {
    const hx = h.x - cameraX*0.25;
    if (hx+h.r < 0 || hx-h.r > W) continue;
    ctx.beginPath();
    ctx.arc(hx, GROUND_Y+30, h.r, Math.PI, 0);
    ctx.fill();
  }

  // nuvens (parallax médio)
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  for (const c of clouds) {
    const cx = c.x - cameraX*0.5;
    if (cx+60 < 0 || cx-60 > W) continue;
    drawCloud(cx, c.y, c.s);
  }
}

function drawPlatform(p) {
  const x = p.x - cameraX;
  if (x+p.w < 0 || x > W) return;
  ctx.save();

  if (p.type === 'ground') {
    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(x, p.y, p.w, p.h);
    ctx.strokeStyle = 'rgba(0,0,0,.15)';
    ctx.lineWidth = 1;
    for (let yy = p.y+16; yy < p.y+p.h; yy += 14) {
      ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x+p.w, yy); ctx.stroke();
    }
    ctx.fillStyle = '#4cbb17';
    ctx.fillRect(x, p.y, p.w, 12);
    ctx.fillStyle = '#7ee13f';
    ctx.fillRect(x, p.y, p.w, 4);
  } else {
    ctx.fillStyle = '#c96a2c';
    ctx.fillRect(x, p.y, p.w, p.h);
    ctx.strokeStyle = 'rgba(0,0,0,.35)';
    ctx.lineWidth = 1.5;
    const rows = Math.max(1, Math.round(p.h/11));
    for (let r=0; r<=rows; r++) {
      const yy = p.y + r*(p.h/rows);
      ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x+p.w, yy); ctx.stroke();
    }
    const cols = Math.max(1, Math.round(p.w/22));
    for (let c=0; c<=cols; c++) {
      const xx = x + c*(p.w/cols);
      ctx.beginPath(); ctx.moveTo(xx, p.y); ctx.lineTo(xx, p.y+p.h); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.fillRect(x, p.y, p.w, 3);
  }
  ctx.restore();
}

function drawCoin(c) {
  if (c.collected) return;
  const x = c.x - cameraX;
  if (x < -20 || x > W+20) return;
  const bob = Math.sin(frame*0.1 + c.x) * 3;
  const spin = Math.abs(Math.sin(frame*0.05 + c.x*0.1));
  const rx = c.r * (0.35 + spin*0.65);
  ctx.save();
  ctx.translate(x, c.y+bob);
  ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 8;
  ctx.fillStyle = '#ffd700';
  ctx.strokeStyle = '#b8860b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, 0, rx, c.r, 0, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawStarShape(cx, cy, r, rot) {
  ctx.beginPath();
  for (let i=0;i<10;i++) {
    const ang = rot + i*Math.PI/5;
    const rad = i%2===0 ? r : r*0.45;
    const px = cx + Math.cos(ang)*rad;
    const py = cy + Math.sin(ang)*rad;
    if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
}

function drawFlag() {
  const x = flag.x - cameraX;
  if (x < -60 || x > W+60) return;
  ctx.save();
  // mastro
  ctx.fillStyle = '#e5e5e5';
  ctx.fillRect(x-3, flag.y-140, 6, 140);
  ctx.fillStyle = '#ffd700';
  ctx.beginPath(); ctx.arc(x, flag.y-140, 8, 0, Math.PI*2); ctx.fill();
  // bandeira balançando
  const wave = Math.sin(frame*0.08) * 6;
  ctx.fillStyle = '#e52521';
  ctx.beginPath();
  ctx.moveTo(x+3, flag.y-125);
  ctx.lineTo(x+38+wave, flag.y-112);
  ctx.lineTo(x+3, flag.y-99);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawPlayer() {
  const cx = player.x - cameraX + player.w/2;
  const cy = player.y + player.h/2;
  ctx.save();
  ctx.shadowColor = '#fff59d';
  ctx.shadowBlur = 16;
  ctx.fillStyle = '#ffd23f';
  ctx.strokeStyle = '#f2a900';
  ctx.lineWidth = 2;
  drawStarShape(cx, cy, player.w/2, -Math.PI/2);
  ctx.fill();
  ctx.stroke();
  // rostinho
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#1a1a1a';
  const fx = player.facing;
  ctx.beginPath();
  ctx.arc(cx + 4*fx, cy - 1, 2.3, 0, Math.PI*2);
  ctx.arc(cx - 3*fx, cy - 1, 2.3, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy+3, 4, 0, Math.PI, false);
  ctx.stroke();
  ctx.restore();
}

function draw() {
  drawBackground();
  for (const p of platforms) drawPlatform(p);
  drawFlag();
  for (const c of coins) drawCoin(c);
  drawPlayer();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

updateHUD();
loop();
</script>
</body>
</html>
