<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Estrela da Manha - Cenario da Rita</title>
<style>
  :root{ color-scheme: dark; }
  html,body{
    margin:0; padding:0; height:100%;
    background:#0d0710;
    display:flex; align-items:center; justify-content:center;
    font-family:'Courier New', monospace;
  }

  /* ==========================================================
     PALCO DO JOGO
     Mantem a proporcao exata do fundo (1408 x 768) pra nunca
     cortar a cena, ficando responsivo em qualquer tela.
     ========================================================== */
  #cena-wrap{
    width: 100%;
    display:flex; align-items:center; justify-content:center;
  }

  #palco{
    position: relative;
    width: min(96vw, 1408px);
    aspect-ratio: 1408 / 768;
    overflow: hidden;
    border-radius: 6px;
    box-shadow: 0 0 0 3px #ffd70066, 0 20px 60px rgba(0,0,0,.6);
  }

  #fundo{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: cover;
    display:block;
  }

  /* ==========================================================
     PERSONAGEM PRINCIPAL - RITA
     Parada, estatica, no meio da tela.

     A TURMA vai controlar essa imagem por codigo (JS puro):
       const ritinha = document.getElementById('ritinha');
       ritinha.style.left = '...';   // ou
       ritinha.style.transform = 'translate(...)';
     Nao ha nenhum controle (teclado/botao) pronto de proposito -
     essa parte e a atividade da turma.
     ========================================================== */
  #ritinha{
    position:absolute;
    left: 50%;
    top: 50%;
    height: 27%;
    width: auto;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 6px 3px rgba(0,0,0,.4));
    z-index: 5;
  }

  /* Camada extra: so escurece um pouco o fundo pra dar contraste ao texto. */
  #palco::before{
    content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:linear-gradient(180deg,rgba(48,12,88,.05),rgba(5,2,22,.26));
  }
  .painel-missao{position:absolute; left:3%; top:4%; z-index:8; max-width:31%; padding:12px 15px; border:2px solid rgba(255,235,133,.85); border-radius:14px; background:rgba(19,7,47,.78); color:#fff; box-shadow:0 0 20px rgba(255,211,74,.35); pointer-events:none;}
  .painel-missao b{display:block; color:#ffe86a; font-size:clamp(10px,1.2vw,17px); letter-spacing:1px; margin-bottom:5px;}
  .painel-missao span{font-size:clamp(8px,1vw,14px);line-height:1.35;}
  .fala-rita{position:absolute; left:55%; top:24%; z-index:7; width:min(27%,285px); padding:11px 14px; border-radius:16px 16px 16px 3px; background:#fff8dc; color:#4a2364; font-family:Arial,sans-serif; font-weight:800; font-size:clamp(9px,1.15vw,16px); line-height:1.25; box-shadow:0 5px 0 rgba(49,17,68,.35); animation:balanco 2.6s ease-in-out infinite; pointer-events:none;}
  .fala-rita::after{content:"";position:absolute;left:-10px;bottom:5px;border-width:8px 10px 8px 0;border-style:solid;border-color:transparent #fff8dc transparent transparent;}
  @keyframes balanco{50%{transform:translateY(-5px) rotate(-1deg)}}
  .legenda-cena{position:absolute; bottom:3%; left:50%; transform:translateX(-50%); z-index:9; padding:8px 15px; border-radius:999px; background:rgba(9,3,25,.7); color:#eaf8ff; border:1px solid rgba(120,234,255,.6); font-size:clamp(8px,1vw,14px); letter-spacing:.6px; white-space:nowrap; pointer-events:none;}
  @media (max-width:600px){.painel-missao{max-width:43%;padding:7px 9px}.fala-rita{top:18%;left:56%;width:32%;padding:7px 9px}.legenda-cena{bottom:2%;padding:5px 8px}}
</style>
</head>
